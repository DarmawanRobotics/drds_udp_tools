      .l { font-family: Barlow, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #8B9196; text-anchor: middle; }
      .h1 { font-family: Barlow, 'Helvetica Neue', Arial, sans-serif; font-size: 58px; font-weight: 600; fill: #FFFFFF; }
      .h2 { font-family: Barlow, 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 500; fill: #A3A9AE; }
    </style>
  </defs>
