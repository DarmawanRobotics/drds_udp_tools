    <pattern id="cells" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="39" height="39" rx="4" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#F2A900"/>
      <rect x="8" width="8" height="16" fill="#000"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
