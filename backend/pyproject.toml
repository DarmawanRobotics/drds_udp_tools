[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drds-udp-tools"
version = "0.2.0"
description = "EZRA UDP Debugger backend — Deep Robotics Inspection Communication Protocol (UDP/DTLS/TCP/TLS) tester"
requires-python = ">=3.10"
authors = [{ name = "agus-darmawan", email = "darmawandeveloper@gmail.com" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyOpenSSL>=24.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ezra-udp = "drds_udp.cli:main"

[tool.setuptools.packages.find]
include = ["drds_udp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
